[package]
name = "orb-relay-rs"
version = "0.1.0"
edition = "2021"
description = "The Focus Orb — realtime audio data plane (STT/TTS WebSocket piping). See docs/adr/0004-backend-language-split.md."

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio-test = "0.4"
