[package]
name = "control"
version = "0.1.0"
edition = "2021"

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
tokio       = { version = "1", features = ["rt-multi-thread", "macros"] }
blake3      = "1"
tiktoken-rs = "0.6"
fs4         = { version = "0.9", features = ["sync"] }
types = { path = "../types" }
router = { path = "../router" }
