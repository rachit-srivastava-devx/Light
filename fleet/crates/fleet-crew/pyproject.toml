[project]
name = "crew"
version = "0.1.0"
description = "Fleet intent-layer SOW construction, keyless CLI adapters, and contract models"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3.0",
  "pydantic>=2.0,<3.0",
  "statsmodels>=0.14,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
