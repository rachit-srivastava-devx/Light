[package]
name = "fleet-events"
version = "0.1.0"
edition = "2021"

[dependencies]
fleet-types = { path = "../fleet-types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
blake3 = "1.8"
reqwest = { version = "0.13", features = ["blocking", "json"] }
notify = "8.2.0"
imap = "2.4.1"
mailparse = "0.16.1"
native-tls = "0.2"

[dev-dependencies]
tempfile = "3"
