[package]
name = "context"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
types = { path = "../types" }
tree-sitter = "0.24.7"
tree-sitter-rust = "0.23.3"
tree-sitter-python = "0.23.6"
tree-sitter-bash = "0.23.3"
blake3 = "1.8.7"
tantivy = "0.26.1"
tiktoken-rs = "0.12.0"

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.14"
proptest = "1.5"
