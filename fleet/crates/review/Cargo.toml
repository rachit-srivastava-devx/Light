[package]
name = "review"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
tokio       = { version = "1", features = ["rt-multi-thread", "process", "macros"] }

# fleet-internal
fleet-plan  = { path = "../../crates/fleet-plan" }
fleet-judge = { path = "../fleet-judge" }

[features]
llm7 = ["fleet-judge/llm7"]
