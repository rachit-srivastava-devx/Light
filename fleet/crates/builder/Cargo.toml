[package]
name = "builder"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "macros"] }
types = { path = "../types" }
merge = { path = "../merge" }
libc = "0.2.189"
nix = { version = "0.29", features = ["process", "resource", "signal"] }
fs2 = "0.4.3"
toml = "0.8"
tempfile = "3.27.0"
