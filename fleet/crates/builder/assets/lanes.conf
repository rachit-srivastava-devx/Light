# Additional failover lanes, in order after api.llm7.io/codestral-latest.
# One url|model[|dialect] record per line. dialect defaults to `openai`; `prompt` sends
# {"model","prompt"} and reads .response. An unknown dialect is refused, not defaulted.
# Keep secrets out of this file.
# Verified keyless 2026-08-24 by bin/lane-probe.sh (19 endpoints probed, these answered 2/2 AND
# reported which model answered — a lane that cannot report its model is excluded, because fleet
# reads resolved_model back from the response and never copies the request).
# Ordered by observed reliability, not by latency: llm7 was 1/2 (rate-limited), the others 2/2.
# 2026-09-03: blockrun.ai removed. It has drifted since the 2026-08-24 probe -- a bare GET now
# returns 402 Payment Required, and a real POST with a request body times out with zero bytes.
# Confirmed persistent across 3 separate M11.sh runs (tests/corpus/M11.sh), not a single blip.
# Excluded per this file's own standing rule (see the ch.at note below): a lane that does not
# currently answer keylessly does not belong here, regardless of why. Re-probe with
# bin/lane-probe.sh before re-adding -- this may be a temporary outage rather than a policy change.
https://devtoolbox-api.devtoolbox-api.workers.dev/ai/generate|llama-3.2-3b-instruct|prompt
