[package]
name = "fleet-store"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "load_extension"] }
blake3 = "1.8"
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
redb = "2"
fleet-types = { path = "../fleet-types" }

[dev-dependencies]
tempfile = "3.27"
