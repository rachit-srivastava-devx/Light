[package]
name = "fleet-cli"
version = "0.1.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "fleet"
path = "main.rs"
# build.rs at the package root (this dir) is picked up by cargo convention automatically.

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
figment = { version = "0.10", features = ["env"] }
tokio = { version = "1", features = ["io-std", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
rayon = "1"
reedline = { version = "0.51", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
libc = "0.2"
types    = { path = "../crates/types" }
control  = { path = "../crates/control" }
store    = { path = "../crates/store" }
route    = { path = "../crates/route" }
scan     = { path = "../crates/scan" }
planner  = { path = "../crates/planner" }
context  = { path = "../crates/context" }
verify   = { path = "../crates/verify" }
integrate = { path = "../crates/integrate" }
knowledge = { path = "../crates/knowledge" }
notify   = { path = "../crates/notify" }
builder  = { path = "../crates/builder" }
review   = { path = "../crates/review" }

[features]
# Passthrough to `review`'s own `llm7` feature (real keyless HTTP adapter). OFF by
# default: `fleet adjudicate` with this feature off fails with a typed "no judge model
# configured" error rather than silently defaulting to a fake or network-backed judge.
llm7 = ["review/llm7"]

[dev-dependencies]
tempfile = "3"
