[package]
name = "fleet-cli"
version = "0.1.1"
edition = "2021"
license.workspace = true

[[bin]]
name = "fleet"
path = "main.rs"
# build.rs at the package root (this dir) is picked up by cargo convention automatically.

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tokio = { version = "1", features = ["io-std", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
rayon = "1"
reedline = { version = "0.51", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
types    = { path = "../crates/types" }
control  = { path = "../crates/control" }
store    = { path = "../crates/store" }
route    = { path = "../crates/route" }
scan     = { path = "../crates/scan" }
planner  = { path = "../crates/planner" }
context  = { path = "../crates/context" }
verify   = { path = "../crates/verify" }
integrate = { path = "../crates/integrate" }
knowledge = { path = "../crates/knowledge" }
notify   = { path = "../crates/notify" }
builder  = { path = "../crates/builder" }
review   = { path = "../crates/review" }
sow-memory = { path = "../crates/sow-memory" }
cli      = { path = "../crates/cli" }
runtime  = { path = "../crates/runtime" }
print    = { path = "../crates/print" }
ingest  = { path = "../crates/ingest" }

[features]
# Passthrough to `review`'s own `llm7` feature (real keyless HTTP adapter). OFF by
# default: `fleet adjudicate` with this feature off fails with a typed "no judge model
# configured" error rather than silently defaulting to a fake or network-backed judge.
llm7 = ["review/llm7"]

[dev-dependencies]
tempfile = "3"
# Real-pty e2e test for the interactive REPL (src/tests/interactive_pty_e2e): reedline needs an
# actual tty, not a pipe, so `Command::output()` can never exercise that code path. `nix` is
# already a workspace dependency (crates/builder); this just turns on its `pty` feature for our
# own dev-dependency edge instead of pulling in a new crate.
nix = { version = "0.29", features = ["term", "process", "fs"] }
libc = "0.2"
