[package]
name = "fleet-ledger"
version = "0.1.0"
edition = "2021"
description = "Hash-chained receipt ledger and mechanical invariants for fleet"
license = "MIT"
repository = "https://example.invalid/fleet"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
proptest = "1"

[[bin]]
name = "fleet-ledger"
path = "src/main.rs"
