name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Must live outside the checked-out repo tree, or the M2 corpus detector
  # (file-count cap) and every other tree-walking check will trip on build
  # artifacts. Same convention as .githooks/pre-commit and AGENTS.md.
  CARGO_TARGET_DIR: ${{ runner.temp }}/fleet-rs-target

jobs:
  release:
    name: Build and publish universal macOS release
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (B11: pinned, semgrep github-actions-mutable-action-tag)

      - name: Install Rust
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        # -- see ci.yml: `@stable` is this action's documented, intentional moving reference.
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-apple-darwin
            x86_64-apple-darwin

      - name: Cache cargo and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4 (B11: pinned)
        with:
          path: |
            ~/.cargo
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('keel/Cargo.lock', 'tests/tools/b3oracle/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      - name: Install verification tools
        run: |
          command -v cargo-deny >/dev/null 2>&1 || cargo +stable install cargo-deny --locked
          command -v cargo-audit >/dev/null 2>&1 || cargo +stable install cargo-audit --locked
          brew list gitleaks >/dev/null 2>&1 || brew install gitleaks

      - name: Run the developer verification gate
        run: ./verify.sh

      - name: Build both supported macOS binaries
        run: |
          cargo build --manifest-path keel/Cargo.toml --release --locked --target aarch64-apple-darwin
          cargo build --manifest-path keel/Cargo.toml --release --locked --target x86_64-apple-darwin

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0 (B11: pinned)

      - name: Assemble universal artifact and CycloneDX SBOM
        run: |
          mkdir -p dist
          lipo -create \
            "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/fleet" \
            "$CARGO_TARGET_DIR/x86_64-apple-darwin/release/fleet" \
            -output dist/fleet
          chmod 0755 dist/fleet
          syft dir:keel -o cyclonedx-json=dist/fleet.cdx.json
          tar -czf "dist/fleet-${GITHUB_REF_NAME}-darwin-universal.tar.gz" -C dist fleet
          shasum -a 256 \
            "dist/fleet-${GITHUB_REF_NAME}-darwin-universal.tar.gz" \
            dist/fleet.cdx.json > dist/SHA256SUMS

      - name: Attach release artifacts
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 (B11: pinned)
        with:
          generate_release_notes: true
          files: |
            dist/fleet-${{ github.ref_name }}-darwin-universal.tar.gz
            dist/fleet.cdx.json
            dist/SHA256SUMS
