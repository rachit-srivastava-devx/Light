[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/dag",
    "crates/store",
    "crates/types",
    "crates/router",
    "crates/scan",
    "crates/plan",
    "crates/merge",
    "crates/intent",
    "crates/ingest",
    "crates/model-catalog",
    "crates/control",
    "crates/route",
    "crates/connectors",
    "crates/context",
    "crates/knowledge",
    "crates/planner",
    "crates/ready",
    "crates/plan-review",
    "crates/review",
    "crates/next-plan",
    "crates/verify",
    "crates/builder",
    "crates/approval",
    "crates/candidate",
    "crates/notify",
    "crates/broker",
    "crates/post",
    "crates/offline",
    "crates/integrate",
    "crates/print",
    "crates/rollback",
    "crates/runtime",
    "crates/sow-memory",
    "crates/user-cli",
    "src",
]
exclude = ["keel", "registry-reference", "tests", "crew", "crates/fleet-crew"]

[workspace.package]
license = "MIT"

# macOS-specific: full DWARF debug info triggers dsymutil bundling on every link, which
# dominates dev/test build time on a 38-crate workspace. line-tables-only keeps panic/backtrace
# line numbers; split-debuginfo=unpacked skips the dsymutil bundling step entirely.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test]
inherits = "dev"
