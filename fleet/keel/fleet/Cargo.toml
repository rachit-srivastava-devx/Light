[package]
name = "fleet"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = "0.28"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
tree-sitter = "0.24"
tree-sitter-bash = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "3.1.4", features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-std", "macros", "rt"] }
toml = "0.8"
blake3 = "1"
fs2 = "0.4"
libc = "0.2.189"
serde_json = "1.0.151"
sha2 = "0.10"

[dev-dependencies]
insta = "1"
trybuild = "1"
