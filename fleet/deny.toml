# cargo-deny configuration for the Fleet workspace.
# Policy: allow standard permissive/weak-copyleft OSS licenses.
# Private first-party crates (fleet-*) carry no published license; they are
# not distributed and are excluded from the license check via exceptions below.
# Reviewed 2026-09-11. Every allowlist entry has a documented rationale.

[advisories]
# Advisories triaged and documented in docs/blueprints-next/SECURITY-TRIAGE.md.
# Each entry has: advisory ID, package, triage verdict, and exposure analysis.
ignore = [
    # RUSTSEC-2023-0086 / GHSA-2326-pfpj-vx3h: lexical-core@0.7.6
    # Triage: unsoundness in numeric parsing (UAF in misaligned read).
    # Exposure: transitive via tantivy; fleet uses tantivy for read-only text
    # retrieval (BM25 scoring). Fleet never passes adversarial numeric strings
    # to lexical-core directly. Fix: update tantivy to pull in lexical-core ≥0.8
    # when tantivy publishes a compatible release (tracked in TECH_DEBT.md).
    { id = "RUSTSEC-2023-0086", reason = "transitive via tantivy; no direct adversarial input path; update when tantivy upgrades" },
    # RUSTSEC-2026-0253: lru@0.16.4
    # Triage: informational advisory in the lru cache crate.
    # Exposure: transitive dependency with no direct fleet usage of affected API.
    # Fix: update when a patched version is available.
    { id = "RUSTSEC-2026-0253", reason = "transitive lru advisory; no direct fleet usage of affected API" },
]

[licenses]
# Fleet workspace crates declare MIT via [workspace.package] in Cargo.toml.
# All listed third-party licenses are standard permissive or weak-copyleft.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "Zlib",
    "0BSD",
    "MIT-0",
    "MPL-2.0",
    # CDLA-Permissive-2.0: webpki-root-certs — permissive, no copyleft
    "CDLA-Permissive-2.0",
    # zlib-acknowledgement: fastdivide — effectively Zlib with attribution note
    "zlib-acknowledgement",
]

exceptions = [
    # LGPL-2.1-or-later: r-efi — Windows EFI type bindings, compile-time only
    # on non-UEFI targets; linking is not dynamic copyleft-triggering here.
    { allow = ["LGPL-2.1-or-later"], name = "r-efi" },
]

# Require all license expressions to be exactly SPDX-compliant.
confidence-threshold = 0.8

[bans]
# Prevent multiple incompatible versions of core crates from entering the tree.
# These entries block known problematic duplicate patterns without blocking all
# duplicates (Cargo sometimes needs multiple for API compatibility).
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
# Only allow dependencies from crates.io and the local workspace.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
